spring:

   application:
       name: notification-server
   datasource:
     driver-class-name: org.postgresql.Driver
     url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydb}
     username: ${DB_USERNAME:myuser}
     password: ${DB_PASSWORD:12345}
   jpa:
     hibernate:
       ddl-auto: update
